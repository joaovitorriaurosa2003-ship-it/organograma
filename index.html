<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Organograma Meia Noite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="theme-color" content="#0d0d0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Meia Noite">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Identidade: o brasão do E.C. Meia Noite é preto e branco. Tudo é tinta e papel;
   as cores dos setores são a única cor da página e marcam a que área cada pessoa pertence. */
:root{
  --bg:#eff0f1; --surface:#ffffff; --surface-2:#f6f7f8; --ink:#111214; --muted:#5d6167;
  --border:#d9dbde; --line:#9ca0a6; --dot:#d3d6d9;
  --plate:#141516; --plate-ink:#ffffff; --hi-bg:#ffffff; --hi-ink:#111214;
  --band:#0d0d0e; --band-ink:#f4f4f4; --danger:#b3261e; --ok:#1d6b3f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.05);
  --shadow:0 10px 28px rgba(0,0,0,.12);
  --shadow-lg:0 30px 70px rgba(0,0,0,.35);
  --ease:cubic-bezier(.2,.8,.2,1);
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0d; --surface:#17181a; --surface-2:#121315; --ink:#eceef0; --muted:#9ca1a8;
  --border:#2b2d31; --line:#62666d; --dot:#26282c;
  --plate:#eceef0; --plate-ink:#111214; --hi-bg:#17181a; --hi-ink:#eceef0;
  --band:#000000; --band-ink:#f4f4f4; --danger:#f2867c; --ok:#6fd39a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0d; --surface:#17181a; --surface-2:#121315; --ink:#eceef0; --muted:#9ca1a8;
  --border:#2b2d31; --line:#62666d; --dot:#26282c;
  --plate:#eceef0; --plate-ink:#111214; --hi-bg:#17181a; --hi-ink:#eceef0;
  --band:#000000; --band-ink:#f4f4f4; --danger:#f2867c; --ok:#6fd39a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gutter{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s var(--ease),opacity .2s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.icon{width:36px;height:36px;padding:0;font-size:18px;line-height:1}
.btn.ghost{background:transparent}

/* ---------- login ---------- */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:#070707;color:#f4f4f4;overflow:hidden}
.gate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0a0a0a 0 90px,#0f0f0f 90px 180px)}
.pitch{position:absolute;inset:-4%;width:108%;height:108%;color:rgba(255,255,255,.09)}
.pitch *{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gate-card{position:relative;width:min(400px,100%);background:#fff;color:#111214;border-radius:20px;padding:34px 30px 26px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}
.gate-logo{width:128px;height:128px;object-fit:contain;animation:pop .9s var(--ease) .1s both}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.gate h1{margin:0;font-family:var(--f-display);font-size:28px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.gate .sub{margin:-12px 0 0;color:#5d6167;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.gate form{width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
.gate label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5d6167}
.gate input{width:100%;border:1px solid #d9dbde;border-radius:12px;padding:12px 14px;background:#f6f7f8;color:#111214;transition:border-color .2s,background .2s,box-shadow .2s}
.gate input:focus{outline:none;border-color:#111214;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.07)}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:12px;font-weight:700;color:#5d6167;cursor:pointer;padding:8px;text-transform:uppercase;letter-spacing:.05em}
.gate .btn.primary{width:100%;padding:13px;font-size:15px;margin-top:4px;background:#111214;color:#fff;border-color:#111214}
.gate-msg{min-height:20px;font-size:13px;color:#b3261e;text-align:center;margin:0}
.gate-msg.info{color:#5d6167}
.gate-foot{font-size:12px;color:#7a7e84;margin:0}
.test-banner{width:100%;background:#f6f7f8;border:1px dashed #9ca0a6;border-radius:12px;padding:10px 12px;font-size:13px;color:#3c3f44;text-align:left}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- topo ---------- */
.band{background:var(--band);color:var(--band-ink);position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(135deg,#f4f4f4 0 10px,#0d0d0e 10px 20px);opacity:.9}
.band-in{display:flex;align-items:center;gap:16px;padding-block:16px 20px;max-width:1500px;margin:0 auto}
.band .crest{width:58px;height:58px;object-fit:contain;filter:invert(1);flex:none}
.brand{min-width:0;flex:1}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b9bcc1;font-weight:600}
.brand h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,34px);line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.user{display:flex;align-items:center;gap:10px;position:relative}
.user .who{font-size:13px;color:#b9bcc1;text-align:right;line-height:1.2}
.user .who b{display:block;color:#fff;font-weight:600;text-transform:capitalize}
.band .btn{background:transparent;color:#f4f4f4;border-color:rgba(255,255,255,.28)}
.band .btn:hover{border-color:#fff}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 6px}

/* ---------- abas ---------- */
.tabbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tabbar-in{display:flex;align-items:center;gap:12px;max-width:1500px;margin:0 auto}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:15px 14px 13px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .25s}
.tab:hover,.tab[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute;left:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ink);width:0;transition:transform .45s var(--ease),width .45s var(--ease)}
.savebox{display:flex;align-items:center;gap:8px;flex:none;padding-block:8px}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.status .dotst{width:8px;height:8px;border-radius:50%;background:var(--ok);transition:background .3s}
.status.dirty{color:var(--ink);font-weight:600}
.status.dirty .dotst{background:#e8a317;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:700px){.status .txt{display:none}.user .who{display:none}.bar .hint{display:none}.band .crest{width:46px;height:46px}.eyebrow{font-size:10.5px;letter-spacing:.1em}}

/* ---------- conteúdo ---------- */
main{max-width:1500px;margin:0 auto;padding-block:24px 48px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.bar .hint{color:var(--muted);font-size:13px}
.spacer{flex:1}
.zoom{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.zoom .btn{border:0}
.zoom .btn.icon{width:30px;height:30px}
.zoom output{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* palco do organograma */
.stage{position:relative;height:clamp(440px,70vh,900px);overflow:auto;border:1px solid var(--border);border-radius:18px;background-color:var(--surface-2);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;cursor:grab;overscroll-behavior:contain}
.stage.panning{cursor:grabbing;user-select:none}
.chart-wrap{position:relative;margin:0 auto}
.chart{position:absolute;left:0;top:0;width:max-content;transform-origin:0 0;padding:36px 48px 64px}
.chart ul{display:flex;justify-content:center;align-items:flex-start;list-style:none;margin:0;padding:46px 0 0}
.chart li{display:flex;flex-direction:column;align-items:center;padding:0 12px}
.chart > ul.roots{padding-top:0;gap:64px}
.teams{display:flex;flex-direction:column;gap:8px;margin:18px 0 0 26px;padding-left:22px;align-self:center}
.team-row{display:flex}
.links{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.links line{stroke:var(--line);stroke-width:2}

/* fichas */
.card{position:relative;z-index:1;cursor:pointer;transition:transform .3s var(--ease),opacity .2s;-webkit-user-select:none;user-select:none}
.card[draggable="true"]{cursor:grab}
.card:hover{transform:translateY(-3px)}
.card .ini{font-family:var(--f-display);font-weight:700;color:var(--sc-ink,#fff);letter-spacing:.02em}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card.ficha{width:206px;display:flex;flex-direction:column;align-items:center;text-align:center}
.card.ficha .avatar{width:78px;height:78px;border-radius:50%;background:var(--sc);border:4px solid var(--surface);box-shadow:0 0 0 2px var(--sc),var(--shadow-sm);overflow:hidden;display:grid;place-items:center;margin-bottom:-20px;position:relative;z-index:2;transition:transform .35s var(--ease)}
.card.ficha:hover .avatar{transform:scale(1.05)}
.card.ficha .ini{font-size:26px}
.plate{width:100%;background:var(--plate);color:var(--plate-ink);border-radius:14px;padding:26px 14px 12px;border-bottom:4px solid var(--sc);box-shadow:var(--shadow-sm);transition:box-shadow .3s var(--ease)}
.card:hover .plate{box-shadow:var(--shadow)}
.cargo{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.12;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.nome{font-size:13px;margin-top:4px;line-height:1.25;opacity:.88}
.card.destaque .plate{background:var(--hi-bg);color:var(--hi-ink);border:2px solid var(--ink);border-bottom:4px solid var(--sc)}
.card.bloco .plate{display:flex;align-items:center;gap:10px;justify-content:center;border-radius:999px;padding:13px 24px;border-bottom:0;box-shadow:inset 0 -4px 0 var(--sc),var(--shadow-sm)}
.card.bloco .sdot{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}
.card.pessoa{width:190px;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--sc);border-radius:11px;padding:8px 11px 8px 9px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s}
.card.pessoa:hover{box-shadow:var(--shadow)}
.mini{width:34px;height:34px;border-radius:50%;flex:none;background:var(--sc);display:grid;place-items:center;overflow:hidden}
.mini .ini{font-size:13px}
.pinfo{min-width:0}
.prole{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.pnome{font-weight:600;font-size:13px;line-height:1.25}
.card.pessoa.destaque{border-color:var(--ink);border-left-color:var(--sc);border-width:2px 2px 2px 4px}
.card.vaga.pessoa{border-style:dashed;border-left-style:solid;background:var(--surface-2);box-shadow:none}
.card.vaga .pnome,.card.vaga .nome{font-style:italic;font-weight:500;opacity:.7}
.card.vaga.ficha .plate{background:var(--surface-2);color:var(--ink);border:2px dashed var(--line);border-bottom:4px solid var(--sc)}
.card .nota{font-size:11px;line-height:1.3;margin-top:4px;opacity:.75;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.card.ficha .tags{justify-content:center}
.tag{font-size:10px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.05em;opacity:.8;white-space:nowrap}
.card.sel .plate,.card.pessoa.sel{outline:2px solid var(--ink);outline-offset:4px}
.card.dragging{opacity:.3}
.drop-inside .plate,.card.pessoa.drop-inside{outline:2px dashed var(--ink);outline-offset:5px}
.card.drop-before::before,.card.drop-after::before{content:"";position:absolute;background:var(--ink);border-radius:3px;z-index:3}
.drop-before.h::before{left:-11px;top:12%;bottom:12%;width:4px}
.drop-after.h::before{right:-11px;top:12%;bottom:12%;width:4px}
.drop-before.v::before{top:-7px;left:0;right:0;height:4px}
.drop-after.v::before{bottom:-7px;left:0;right:0;height:4px}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.legend b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-size:13px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.lg i.vg{border-radius:3px;background:transparent;border:1.5px dashed var(--line);width:18px}
.lg i.hi{border-radius:3px;background:var(--hi-bg);border:2px solid var(--ink);width:18px}

/* estado vazio */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{margin:0;font-family:var(--f-display);text-transform:uppercase;font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* abas de setor */
.section-title{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.section-title h2{margin:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.section-sub{color:var(--muted);margin:0 0 18px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s;display:flex;flex-direction:column}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line)}
.fcard.sel{outline:2px solid var(--ink);outline-offset:3px}
.fcard header{display:flex;gap:12px;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--border);position:relative}
.fcard header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.favatar{width:46px;height:46px;border-radius:50%;background:var(--sc);display:grid;place-items:center;overflow:hidden;flex:none}
.favatar img{width:100%;height:100%;object-fit:cover}
.favatar .ini{font-family:var(--f-display);font-weight:700;color:var(--sc-ink,#fff);font-size:17px}
.fname{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fname .tag{font-family:var(--f-body);font-weight:600}
.frole{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.resp{list-style:none;margin:0;padding:10px 16px 14px}
.resp li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink)}
.resp li:last-child{border-bottom:0}
.resp li::before{content:"";width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--sc);flex:none}
.fempty{margin:0;padding:12px 16px 14px;color:var(--muted);font-size:13px;font-style:italic}
.obs-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 12px}
.obs-head h3{margin:0;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.obs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.obs{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--sc);border-radius:4px 14px 14px 4px;padding:14px 18px;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.obs:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.obs h4{margin:0 0 8px;font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.obs ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.muted-note{color:var(--muted);font-size:13px}
.vcard{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.vcard h4{margin:0 0 4px;font-family:var(--f-display);font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vcard .vset{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}
.vcard p{margin:0;font-size:13px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12px;text-align:left;padding:11px 14px;background:var(--ink);color:var(--surface);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
td:first-child{font-weight:600}

/* ---------- painel de edição ---------- */
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.18)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.dhead h2{margin:0;font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.dbody{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.dfoot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface-2)}
.dfoot .status{flex:1}
@media (max-width:640px){.drawer{top:auto;width:100%;max-height:86vh;border-radius:20px 20px 0 0;border-left:0;padding-left:env(safe-area-inset-left,0px)}}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface-2);transition:border-color .2s,background .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.field textarea{resize:vertical;min-height:96px;line-height:1.45}
.field small{color:var(--muted);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--ink)}
.photo-row{display:flex;align-items:center;gap:14px}
.photo-row .favatar{width:64px;height:64px}
.photo-btns{display:flex;gap:6px;flex-wrap:wrap}
.dactions{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;border-top:1px solid var(--border)}
.note{margin:0;font-size:12px;color:var(--muted)}
.srow{display:grid;grid-template-columns:36px 1fr 1fr 36px;gap:6px;align-items:center}
.srow input[type=color]{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;padding:2px;background:var(--surface);cursor:pointer}
.srow input[type=text]{width:100%;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface-2);min-width:0}
.shead{display:grid;grid-template-columns:36px 1fr 1fr 36px;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* avisos */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 12px 11px 16px;box-shadow:var(--shadow-lg);font-size:14px;max-width:100%}
.toast span{flex:1}
.toast.erro{background:var(--danger);color:#fff}
.toast .btn{background:transparent;color:inherit;border-color:currentColor}
.toast .x{border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer;opacity:.7;padding:0 4px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .pitch *{stroke-dashoffset:0}
}
</style>
</head>

try { const z = parseFloat(localStorage.getItem("org-zoom")); if (z >= 0.3 && z <= 1.6) zoom = z; } catch (e) {}

const SETORES_PADRAO = [
  { id: "direcao", nome: "Direção", cor: "#1a1a1a", aba: "" },
  { id: "esporte", nome: "Esporte", cor: "#64808f", aba: "Esporte" }
];
function vazio() {
  return { titulo: "Dashboard de Equipes", subtitulo: "E.C. Meia Noite SAF · Patrocínio Paulista", logo: null,
    setores: SETORES_PADRAO.map(s => ({ ...s })), roots: [], colaboradores: [], obs: {} };
}
function normNode(n) {
  return { id: n.id || uid(), tipo: ["ficha", "pessoa", "bloco"].includes(n.tipo) ? n.tipo : "ficha",
    cargo: n.cargo || "", nome: n.nome || "", setor: n.setor || "", foto: n.foto || null,
    destaque: !!n.destaque, vaga: !!n.vaga, tags: Array.isArray(n.tags) ? n.tags : [],
    resp: Array.isArray(n.resp) ? n.resp : [], nota: n.nota || "",
    children: Array.isArray(n.children) ? n.children.map(normNode) : [] };
}
function normalize(d) {
  const v = vazio();
  return { titulo: d.titulo ?? v.titulo, subtitulo: d.subtitulo ?? v.subtitulo, logo: d.logo || null,
    setores: Array.isArray(d.setores) && d.setores.length ? d.setores : v.setores,
    roots: Array.isArray(d.roots) ? d.roots.map(normNode) : [],
    colaboradores: Array.isArray(d.colaboradores) ? d.colaboradores : [],
    obs: d.obs && typeof d.obs === "object" ? d.obs : {} };
}

function walk(list, fn, parent = null) {
  for (let i = 0; i < list.length; i++) {
    if (fn(list[i], parent, list, i) === false) return false;
    if (walk(list[i].children, fn, list[i]) === false) return false;
  }
}
function find(id) { let r = null; walk(state.roots, (n, p, l, i) => { if (n.id === id) { r = { node: n, parent: p, list: l, index: i }; return false; } }); return r; }
function inSub(node, id) { return node.id === id || node.children.some(c => inSub(c, id)); }
function setor(id) { return state.setores.find(s => s.id === id); }
function corDe(n) { return (setor(n.setor) || {}).cor || "#1a1a1a"; }
function tintaSobre(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#fff";
  const v = parseInt(m[1], 16), r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  const L = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return L > 0.62 ? "#111214" : "#ffffff";
}
function scStyle(n) { const c = corDe(n); return `--sc:${c};--sc-ink:${tintaSobre(c)}`; }
function iniciais(t) {
  const p = String(t || "").replace(/^(dr|dra|sr|sra)\.?\s+/i, "").replace(/[()]/g, "").trim().split(/\s+/).filter(Boolean);
  if (!p.length) return "?";
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}
function abas() {
  const out = []; state.setores.forEach(s => { const a = (s.aba || "").trim(); if (a && !out.includes(a)) out.push(a); });
  return ["Organograma", ...out, "Colaboradores", "Vagas"];
}
function corDaAba(a) { const s = state.setores.find(x => (x.aba || "").trim() === a); return s ? s.cor : "var(--ink)"; }

/* ---------------- armazenamento ---------------- */
const LOCAL_KEY = "organograma-meia-noite-teste";
const store = {
  async carregar() {
    if (fb) {
      const snap = await fb.fs.getDoc(fb.ref);
      if (!snap.exists()) return { dados: null, versao: 0 };
      const d = snap.data();
      return { dados: typeof d.dados === "string" ? JSON.parse(d.dados) : d.dados, versao: d.versao || 0 };
    }
    try { const raw = localStorage.getItem(LOCAL_KEY); if (!raw) return { dados: null, versao: 0 }; const o = JSON.parse(raw); return { dados: o.dados, versao: o.versao || 0 }; }
    catch (e) { return { dados: null, versao: 0 }; }
  },
  async salvar(dados, base) {
    const texto = JSON.stringify(dados);
    if (texto.length > 950000) { const e = new Error("grande"); e.code = "grande"; throw e; }
    if (fb) {
      return fb.fs.runTransaction(fb.db, async tx => {
        const s = await tx.get(fb.ref);
        const v = s.exists() ? (s.data().versao || 0) : 0;
        if (v !== base) { const e = new Error("conflito"); e.code = "conflito"; throw e; }
        tx.set(fb.ref, { dados: texto, versao: v + 1, atualizadoEm: fb.fs.serverTimestamp(), atualizadoPor: fb.auth.currentUser ? fb.auth.currentUser.email : "" });
        return v + 1;
      });
    }
    localStorage.setItem(LOCAL_KEY, JSON.stringify({ dados, versao: base + 1 }));
    return base + 1;
  }
};

/* ---------------- avisos ---------------- */
function toast(msg, tipo = "info", acao = null, dur = 3600) {
  const t = document.createElement("div");
  t.className = "toast " + tipo; t.setAttribute("role", tipo === "erro" ? "alert" : "status");
  t.innerHTML = `<span>${esc(msg)}</span>`;
  let timer = null;
  const fechar = () => { clearTimeout(timer); const a = anim(t, [{ opacity: 1 }, { opacity: 0, transform: "translateY(10px)" }], { duration: 200, easing: "ease-in" }); (a ? a.finished : Promise.resolve()).then(() => t.remove()); };
  if (acao) { const b = document.createElement("button"); b.className = "btn sm"; b.textContent = acao.label; b.onclick = () => { acao.fn(); fechar(); }; t.append(b); }
  const x = document.createElement("button"); x.className = "x"; x.setAttribute("aria-label", "Fechar aviso"); x.textContent = "×"; x.onclick = fechar; t.append(x);
  $("#toasts").append(t);
  anim(t, [{ opacity: 0, transform: "translateY(18px) scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: EASE });
  if (dur) timer = setTimeout(fechar, dur);
}

/* ---------------- entrada ---------------- */
const gateMsg = (m, info) => { const el = $("#l-msg"); el.textContent = m || ""; el.className = "gate-msg" + (info ? " info" : ""); };
function prontoParaEntrar() {
  const b = $("#l-btn"); b.disabled = false;
  if (CONFIGURADO) { b.textContent = "Entrar"; $("#login-fields").hidden = false; setTimeout(() => $("#l-user").focus(), 300); }
  else { b.textContent = "Entrar no modo de teste"; $("#login-fields").hidden = true; $("#test-banner").hidden = false; }
}
function tremer() { const c = $("#gate-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
$("#l-show").addEventListener("click", () => { const i = $("#l-pass"), v = i.type === "password"; i.type = v ? "text" : "password"; $("#l-show").textContent = v ? "Ocultar" : "Mostrar"; $("#l-show").setAttribute("aria-label", v ? "Ocultar senha" : "Mostrar senha"); });
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!CONFIGURADO) { entrar(null); return; }
  const u = $("#l-user").value.trim(), p = $("#l-pass").value;
  if (!u || !p) { gateMsg("Preencha usuário e senha."); tremer(); return; }
  const email = u.includes("@") ? u : u.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "") + "@" + DOMINIO_LOGIN;
  const b = $("#l-btn"); b.disabled = true; b.innerHTML = '<span class="spin"></span> Entrando…'; gateMsg("");
  try { await fb.authM.signInWithEmailAndPassword(fb.auth, email, p); }
  catch (err) {
    const c = err && err.code || "";
    gateMsg(c === "auth/too-many-requests" ? "Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo."
      : c === "auth/network-request-failed" ? "Sem conexão com a internet. Verifique e tente de novo."
      : /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Usuário ou senha incorretos."
      : "Não foi possível entrar (" + c + ").");
    tremer(); b.disabled = false; b.textContent = "Entrar"; $("#l-pass").select();
  }
});

let entrou = false;
async function entrar(user) {
  if (entrou) return; entrou = true;
  try {
    const r = await store.carregar();
    versao = r.versao;
    if (r.dados) { state = normalize(r.dados); semDados = false; }
    else {
      state = vazio(); semDados = true;
      if (!fb) { try { const resp = await fetch("dados-iniciais.json", { cache: "no-store" }); if (resp.ok) { state = normalize(await resp.json()); semDados = false; } } catch (e) {} }
    }
    savedJSON = JSON.stringify(state);
  } catch (err) {
    entrou = false;
    gateMsg(err && err.code === "permission-denied"
      ? "Seu usuário entrou, mas não tem permissão para abrir o organograma. Confira as regras do Firestore (veja o LEIA-ME)."
      : "Não foi possível carregar o organograma. Verifique a internet e tente de novo.");
    if (fb) await fb.authM.signOut(fb.auth);
    prontoParaEntrar(); return;
  }
  usuario = user ? (user.email || "").split("@")[0] : "modo de teste";
  const gate = $("#gate"), app = $("#app");
  app.hidden = false;
  montarApp();
  const a = anim(gate, [{ opacity: 1 }, { opacity: 0, transform: "scale(1.03)" }], { duration: 420, easing: EASE });
  anim(app, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 520, easing: EASE, delay: 120, fill: "backwards" });
  (a ? a.finished : Promise.resolve()).then(() => { gate.hidden = true; });
}

  const p = $("#panel"), y = window.scrollY;

}

/* ---------- organograma ---------- */
function contagens() {
  let pessoas = 0, vagas = 0; const sets = new Set();
  walk(state.roots, n => { if (n.vaga) vagas++; else if (n.tipo !== "bloco") pessoas++; });
  state.roots.forEach(r => r.children.forEach(c => c.setor && sets.add(c.setor)));
  return { colab: state.colaboradores.length, pessoas, setores: sets.size, vagas };
}
function htmlOrganograma() {
  const c = contagens();
  const stats = `<section class="stats">
    <div class="stat stagger"><b data-n="${c.colab}">${c.colab}</b><span>Colaboradores registrados</span></div>
    <div class="stat stagger"><b data-n="${c.pessoas}">${c.pessoas}</b><span>Pessoas no organograma</span></div>
    <div class="stat stagger"><b data-n="${c.setores}">${c.setores}</b><span>Setores</span></div>
    <div class="stat stagger"><b data-n="${c.vagas}">${c.vagas}</b><span>Vagas em estudo</span></div></section>`;
  if (semDados && !state.roots.length) return stats + `<div class="empty stagger"><img src="${LOGO_PADRAO}" alt="" width="84" height="84" style="opacity:.9"><h2>Organograma ainda vazio</h2>
    <p>Importe o arquivo <b>dados-iniciais.json</b> que acompanha esta página para carregar a estrutura atual do clube, ou comece com uma ficha em branco.</p>
    <div class="row"><button class="btn primary" id="b-imp-vazio">Importar dados</button><button class="btn" id="b-zero">Começar do zero</button></div></div>`;
  return stats + `<div class="bar">
      <button class="btn sm primary" id="b-nova">+ Nova ficha</button>
      <button class="btn sm" id="b-setores">Setores e cores</button>
      <span class="hint">Clique para editar · arraste sobre outra ficha para mudar a quem ela responde · arraste o fundo para navegar · Ctrl + rolagem para zoom</span>
      <span class="spacer"></span>
      <div class="zoom"><button class="btn icon" id="z-out" aria-label="Diminuir zoom">−</button><output id="z-val">${Math.round(zoom * 100)}%</output><button class="btn icon" id="z-in" aria-label="Aumentar zoom">+</button><button class="btn sm ghost" id="z-fit">Ajustar</button></div>
    </div>
    <div class="stage" id="stage"><div class="chart-wrap" id="wrap"><div class="chart" id="chart"><svg class="links" id="links" aria-hidden="true"></svg><ul class="roots"></ul></div></div></div>
    <div class="legend" id="legend"></div>`;
}
function ligarOrganograma(animar) {
  const iv = $("#b-imp-vazio"); if (iv) iv.addEventListener("click", () => $("#f-import").click());
  const z0 = $("#b-zero"); if (z0) z0.addEventListener("click", () => {
    const r = normNode({ tipo: "ficha", cargo: "CEO", nome: "", setor: "direcao", destaque: true });
    state.roots.push(r); semDados = false; alterou(); mostrarAba("Organograma", true); abrirEditor("node", r.id);
  });
  $$(".stat b[data-n]").forEach(b => contar(b, +b.dataset.n, animar));
  if (!$("#chart")) return;
  $("#b-nova").addEventListener("click", novaFicha);
  $("#b-setores").addEventListener("click", () => abrirEditor("setores"));
  $("#z-in").addEventListener("click", () => zoomPara(zoom * 1.2));
  $("#z-out").addEventListener("click", () => zoomPara(zoom / 1.2));
  $("#z-fit").addEventListener("click", ajustar);
  ligarPalco();
  renderChart(false);
  renderLegenda();
  aplicarZoom(zoom);
  const st = $("#stage"); st.scrollLeft = Math.max(0, ($("#wrap").offsetWidth - st.clientWidth) / 2);
  if (animar) entradaCascata();
}
function contar(el, alvo, animar) {
  if (!animar || REDUZ) { el.textContent = alvo; return; }
  const t0 = performance.now(), d = 800;
  const f = t => { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(alvo * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function atualizarStats() {
  const c = contagens(), v = [c.colab, c.pessoas, c.setores, c.vagas];
  $$(".stat b").forEach((b, i) => { if (+b.textContent !== v[i]) { b.textContent = v[i]; anim(b, [{ transform: "scale(1.18)" }, { transform: "none" }], { duration: 300, easing: EASE }); } });
}
function renderLegenda() {
  const el = $("#legend"); if (!el) return;
  const usados = new Set(); walk(state.roots, n => { if (n.setor) usados.add(n.setor); });
  el.innerHTML = "<b>Legenda</b>" + state.setores.filter(s => usados.has(s.id)).map(s => `<span class="lg"><i style="--c:${esc(s.cor)}"></i>${esc(s.nome)}</span>`).join("")
    + '<span class="lg"><i class="hi"></i>Destaque</span><span class="lg"><i class="vg"></i>Vaga em estudo</span>';
}

function htmlTags(n) { return n.tags.length ? `<div class="tags">${n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""; }
function htmlFoto(n) { return n.foto ? `<img src="${esc(n.foto)}" alt="">` : `<span class="ini">${esc(iniciais(n.nome || n.cargo))}</span>`; }
function htmlCard(n) {
  const cls = `card ${n.tipo}${n.destaque ? " destaque" : ""}${n.vaga ? " vaga" : ""}`;
  const at = `class="${cls}" data-id="${esc(n.id)}" style="${scStyle(n)}" draggable="true" tabindex="0" role="button" aria-label="${esc((n.cargo || "") + " " + (n.nome || ""))}"`;
  const nome = n.vaga ? "Vaga em estudo" : (n.nome || "A definir");
  const nota = n.nota ? `<div class="nota">${esc(n.nota)}</div>` : "";
  if (n.tipo === "pessoa") return `<div ${at}><div class="mini">${n.vaga ? '<span class="ini">?</span>' : htmlFoto(n)}</div><div class="pinfo"><div class="prole">${esc(n.cargo || "Cargo")}</div><div class="pnome">${esc(nome)}</div>${htmlTags(n)}${nota}</div></div>`;
  if (n.tipo === "bloco") return `<div ${at}><div class="plate"><span class="sdot"></span><div><div class="cargo">${esc(n.cargo || "Setor")}</div>${n.nome ? `<div class="nome">${esc(n.nome)}</div>` : ""}</div></div></div>`;
  return `<div ${at}><div class="avatar">${n.vaga ? '<span class="ini">?</span>' : htmlFoto(n)}</div><div class="plate"><div class="cargo">${esc(n.cargo || "Cargo")}</div><div class="nome">${esc(nome)}</div>${htmlTags(n)}${nota}</div></div>`;
}
function emLista(n) { return n.children.length && n.children.every(c => c.tipo === "pessoa" && !c.children.length); }
function htmlNo(n) {
  let h = htmlCard(n);
  if (n.children.length) h += emLista(n)
    ? `<div class="teams">${n.children.map(c => `<div class="team-row">${htmlCard(c)}</div>`).join("")}</div>`
    : `<ul>${n.children.map(c => `<li>${htmlNo(c)}</li>`).join("")}</ul>`;
  return h;
}
function pos(el, raiz) { let x = 0, y = 0, e = el; while (e && e !== raiz) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { l: x, t: y, r: x + el.offsetWidth, b: y + el.offsetHeight }; }
function fotografar() { const ch = $("#chart"), m = new Map(); if (ch) $$(".card", ch).forEach(el => m.set(el.dataset.id, pos(el, ch))); return m; }

function renderChart(animar) {
  const ch = $("#chart"); if (!ch) return;
  const antes = animar && !REDUZ ? fotografar() : null;
  $("ul.roots", ch).innerHTML = state.roots.map(n => `<li>${htmlNo(n)}</li>`).join("");
  $$(".card", ch).forEach(ligarCard);
  desenharLinhas(); aplicarZoom(zoom);
  marcarSelecao();
  if (antes) {
    $$(".card", ch).forEach(el => {
      const b = antes.get(el.dataset.id), a = pos(el, ch);
      if (!b) { anim(el, [{ opacity: 0, transform: "scale(.86)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: 120, easing: EASE, fill: "backwards" }); return; }
      const dx = b.l - a.l, dy = b.t - a.t;
      if (Math.abs(dx) + Math.abs(dy) > .5) anim(el, [{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 520, easing: EASE });
    });
    anim($("#links"), [{ opacity: 0 }, { opacity: 1 }], { duration: 360, delay: 320, easing: "ease-out", fill: "backwards" });
  }
}
function entradaCascata() {
  const ch = $("#chart"); if (!ch || REDUZ) return;
  const cards = $$(".card", ch).map(el => ({ el, p: pos(el, ch) })).sort((a, b) => a.p.t - b.p.t || a.p.l - b.p.l);
  cards.forEach(({ el }, i) => anim(el, [{ opacity: 0, transform: "translateY(16px) scale(.96)" }, { opacity: 1, transform: "none" }], { duration: 520, delay: 120 + Math.min(i * 16, 640), easing: EASE, fill: "backwards" }));
  anim($("#links"), [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 380, easing: "ease-out", fill: "backwards" });
}
function atualizarCard(id) {
  const ch = $("#chart"); if (!ch) return redesenharPainel();
  const el = $(`.card[data-id="${CSS.escape(id)}"]`, ch), f = find(id); if (!el || !f) return;
  const t = document.createElement("template"); t.innerHTML = htmlCard(f.node);
  const novo = t.content.firstElementChild; el.replaceWith(novo); ligarCard(novo);
  desenharLinhas(); aplicarZoom(zoom); marcarSelecao();
}

/* linhas tracejadas: cada trecho começa e termina num traço */
function desenharLinhas() {
  const ch = $("#chart"), svg = $("#links"); if (!ch || !svg) return;
  const out = [];
  const seg = (x1, y1, x2, y2) => {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < .5) return;
    const d = 6, g0 = 5; let n = Math.round((L + g0) / (d + g0)), da = "";

    out.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"${da}/>`);
  };
  const el = id => $(`.card[data-id="${CSS.escape(id)}"]`, ch);
  walk(state.roots, n => {
    if (!n.children.length) return;
    const pe = el(n.id); if (!pe) return;
    const p = pos(pe, ch), px = (p.l + p.r) / 2;
    const kids = n.children.map(c => { const e = el(c.id); return e ? pos(e, ch) : null; }).filter(Boolean);
    if (!kids.length) return;
    const lista = pe.nextElementSibling;
    if (lista && lista.classList.contains("teams")) {

      for (let i = 0; i < pts.length - 1; i++) seg(sx, pts[i], sx, pts[i + 1]);
      kids.forEach((b, i) => seg(sx, ys[i], b.l, ys[i]));
      return;
    }
    const topo = Math.min(...kids.map(b => b.t)), xs = kids.map(b => (b.l + b.r) / 2);
    if (kids.length === 1 && Math.abs(xs[0] - px) < 1) { seg(px, p.b, px, kids[0].t); return; }
    const by = p.b + (topo - p.b) / 2;
    seg(px, p.b, px, by);
    const todos = [...xs, px].sort((a, b) => a - b).filter((x, i, a) => i === 0 || x - a[i - 1] > 1);
    for (let i = 0; i < todos.length - 1; i++) seg(todos[i], by, todos[i + 1], by);
    kids.forEach((b, i) => seg(xs[i], by, xs[i], b.t));
  });

}

/* zoom suave e navegação */
function aplicarZoom(z) {
  zoom = z;
  const ch = $("#chart"), w = $("#wrap"); if (!ch || !w) return;
  ch.style.transform = `scale(${z})`;
  w.style.width = ch.offsetWidth * z + "px"; w.style.height = ch.offsetHeight * z + "px";
  const o = $("#z-val"); if (o) o.textContent = Math.round(z * 100) + "%";
}

function zoomPara(alvo, ancora, animar = true, fim) {
  const st = $("#stage"), w = $("#wrap"); if (!st || !w) return;
  alvo = clamp(alvo, .3, 1.6);

  const ax = ancora ? ancora.x - sr.left : st.clientWidth / 2, ay = ancora ? ancora.y - sr.top : st.clientHeight / 2;
  const px = (st.scrollLeft + ax - w.offsetLeft) / zoom, py = (st.scrollTop + ay - w.offsetTop) / zoom;
  const de = zoom, t0 = performance.now(), dur = animar && !REDUZ ? 320 : 0;

    aplicarZoom(z);

    if (k < 1) zoomRaf = requestAnimationFrame(passo);
    else { try { localStorage.setItem("org-zoom", String(Math.round(z * 100) / 100)); } catch (e) {} if (fim) fim(); }

}

}
let arraste = null, moveu = false;
function ligarPalco() {

    st.setPointerCapture(e.pointerId); st.classList.add("panning");

  st.addEventListener("pointermove", e => {

    const dx = e.clientX - arraste.x, dy = e.clientY - arraste.y; if (Math.abs(dx) + Math.abs(dy) > 3) moveu = true;

}

/* arrastar e soltar fichas */
let dragId = null;
function zona(card, e) {

}

function ligarCard(card) {

  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirEditor("node", id); } });
  card.addEventListener("dragstart", e => { dragId = id; moveu = false; requestAnimationFrame(() => card.classList.add("dragging")); try { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; } catch (x) {} });
  card.addEventListener("dragend", () => { dragId = null; card.classList.remove("dragging"); limparAlvo(); });

    if (!dragId || dragId === id) return;
    const f = find(dragId); if (!f || inSub(f.node, id)) return;
    e.preventDefault(); const z = zona(card, e);
    if (!card.classList.contains("drop-" + z.z)) { limparAlvo(); card.classList.add("drop-" + z.z, z.eixo); }
  });

}
function mover(id, alvoId, z) {

}

      <input type="text" class="s-aba" value="${esc(s.aba || "")}" list="abas-lista" aria-label="Aba de ${esc(s.nome)}">
      <button class="btn icon sm ghost s-del" aria-label="Remover ${esc(s.nome)}"${u ? ` disabled title="Em uso por ${u} ${u === 1 ? "ficha" : "fichas"}"` : ""}>×</button></div>`; }).join("")}
    <datalist id="abas-lista">${abasLista.map(a => `<option value="${esc(a)}">`).join("")}</datalist>
    <div><button class="btn sm" id="b-set-add">+ Novo setor</button></div>`;
  $$(".srow", body).forEach(row => {
    const s = state.setores[+row.dataset.i];
    $('input[type=color]', row).addEventListener("input", e => { s.cor = e.target.value; alterou(); redesenharPainel(); });
    $(".s-nome", row).addEventListener("input", e => { s.nome = e.target.value; alterou(); renderLegenda(); });
    $(".s-aba", row).addEventListener("change", e => { s.aba = e.target.value.trim(); alterou(); renderAbas(); });
    $(".s-del", row).addEventListener("click", () => { state.setores.splice(+row.dataset.i, 1); alterou(); renderAbas(); preencherEditor(); });
  });
  on("b-set-add", "click", () => { state.setores.push({ id: uid(), nome: "Novo setor", cor: "#6b7280", aba: "" }); alterou(); preencherEditor(); const r = $$(".srow", body).pop(); if (r) { anim(r, [{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }], { duration: 280, easing: EASE }); $(".s-nome", r).select(); } });
}
function editorObs(body, t) {
  const lista = state.obs[drawer.arg.aba] || [], o = lista[drawer.arg.i]; if (!o) { fecharEditor(); return; }
  t.textContent = "Observação";
  body.innerHTML = `<div class="field"><label for="o-tit">Título</label><input type="text" id="o-tit" value="${esc(o.titulo)}"></div>
    <div class="field"><label for="o-it">Itens</label><textarea id="o-it" rows="8">${esc(o.itens.join("\n"))}</textarea><small>Um item por linha.</small></div>
    <div class="dactions"><span class="spacer"></span><button class="btn sm danger" id="o-del">Excluir observação</button></div>`;
  on("o-tit", "input", e => { o.titulo = e.target.value; alterou(); redesenharPainel(); });
  on("o-it", "input", e => { o.itens = e.target.value.split("\n").map(s => s.trim()).filter(Boolean); alterou(); redesenharPainel(); });
  confirmar("o-del", "Confirmar exclusão", () => { lista.splice(drawer.arg.i, 1); fecharEditor(); alterou(); redesenharPainel(); });
}
function editorColab(body, t) {
  const r = state.colaboradores[drawer.arg]; if (!r) { fecharEditor(); return; }
  t.textContent = "Colaborador";
  body.innerHTML = `<div class="field"><label for="c-nome">Nome</label><input type="text" id="c-nome" value="${esc(r.nome)}"></div>
    <div class="field"><label for="c-cargo">Cargo no registro</label><input type="text" id="c-cargo" value="${esc(r.cargo)}"></div>
    <div class="field"><label for="c-setor">Setor no organograma</label><input type="text" id="c-setor" value="${esc(r.setor)}"></div>
    <div class="field"><label for="c-adm">Admissão</label><input type="text" id="c-adm" value="${esc(r.admissao)}" placeholder="dd/mm/aaaa" inputmode="numeric"></div>
    <div class="dactions"><span class="spacer"></span><button class="btn sm danger" id="c-del">Excluir colaborador</button></div>`;
  ["nome", "cargo", "setor"].forEach(k => on("c-" + k, "input", e => { r[k] = e.target.value; alterou(); redesenharPainel(); }));
  on("c-adm", "input", e => { r.admissao = e.target.value; alterou(); redesenharPainel(); });
  confirmar("c-del", "Confirmar exclusão", () => { state.colaboradores.splice(drawer.arg, 1); fecharEditor(); alterou(); redesenharPainel(); });
}
function editorGeral(body, t) {
  t.textContent = "Topo e logo";
  body.innerHTML = `<div class="field"><label for="g-tit">Título</label><input type="text" id="g-tit" value="${esc(state.titulo)}"></div>
    <div class="field"><label for="g-sub">Linha acima do título</label><input type="text" id="g-sub" value="${esc(state.subtitulo)}"></div>
    <div class="field"><span class="flabel">Logo</span><div class="photo-row"><img src="${esc(state.logo || LOGO_PADRAO)}" alt="" width="64" height="64" style="object-fit:contain;background:#fff;border-radius:12px;padding:4px;border:1px solid var(--border)">
      <div class="photo-btns"><button class="btn sm" id="g-logo">Trocar logo</button>${state.logo ? '<button class="btn sm ghost" id="g-nologo">Voltar ao brasão oficial</button>' : ""}</div></div></div>`;
  on("g-tit", "input", e => { state.titulo = e.target.value; alterou(); renderTopo(); });
  on("g-sub", "input", e => { state.subtitulo = e.target.value; alterou(); renderTopo(); });
  on("g-logo", "click", () => escolherImagem(false, url => { state.logo = url; alterou(); renderTopo(); preencherEditor(); }));
  on("g-nologo", "click", () => { state.logo = null; alterou(); renderTopo(); preencherEditor(); });
}

/* imagens: fotos viram quadrados de 200px em JPEG para caber no Firebase */
let aoEscolher = null;
function escolherImagem(quadrada, cb) { aoEscolher = { quadrada, cb }; const i = $("#f-image"); i.value = ""; i.click(); }
$("#f-image").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0], pedido = aoEscolher; if (!file || !pedido) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"), x = c.getContext("2d");
      if (pedido.quadrada) { const m = Math.min(img.width, img.height), s = 200; c.width = c.height = s; x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); pedido.cb(c.toDataURL("image/jpeg", .8)); }
      else { const k = Math.min(1, 240 / Math.max(img.width, img.height)); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); x.drawImage(img, 0, 0, c.width, c.height); pedido.cb(c.toDataURL("image/png")); }
    };
    img.onerror = () => toast("Não consegui ler essa imagem. Use um arquivo JPG ou PNG.", "erro");
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

/* ---------- salvar, descartar, backup ---------- */
function alterou() { dirty = true; atualizarSalvar(); }
function atualizarSalvar() {
  const s = $("#status"), tx = $("#status-txt");
  s.className = "status" + (dirty ? " dirty" : "");
  tx.textContent = saving ? "Salvando…" : dirty ? "Alterações não salvas" : "Tudo salvo";
  $("#b-save").disabled = !dirty || saving;
  $("#b-save").innerHTML = saving ? '<span class="spin"></span> Salvando' : "Salvar";
  $("#b-discard").hidden = !dirty || saving;
  const ds = $("#d-save");
  if (ds) { ds.disabled = !dirty || saving; ds.innerHTML = $("#b-save").innerHTML; $("#d-status").className = s.className; $("#d-status-txt").textContent = tx.textContent; }
}
async function salvar() {
  if (!dirty || saving) return;
  saving = true; atualizarSalvar();
  try {
    versao = await store.salvar(state, versao);
    savedJSON = JSON.stringify(state); dirty = false; semDados = false;
    toast(fb ? "Organograma salvo." : "Salvo neste navegador (modo de teste).");
  } catch (e) {
    const c = e && e.code;
    if (c === "conflito") toast("Outra pessoa salvou uma versão mais nova. Baixe um backup das suas alterações e recarregue a página.", "erro", { label: "Baixar backup", fn: exportar }, 0);
    else if (c === "grande") toast("O organograma passou do limite de 1 MB do Firebase. Remova algumas fotos ou use imagens menores.", "erro", null, 0);
    else if (c === "permission-denied") toast("Sem permissão para salvar. Confira as regras do Firestore.", "erro", null, 0);
    else toast("Não foi possível salvar. Verifique a internet e tente de novo.", "erro", null, 0);
  }
  saving = false; atualizarSalvar();
}
$("#b-save").addEventListener("click", salvar);
confirmar("b-discard", "Confirmar descarte", () => {
  state = normalize(JSON.parse(savedJSON)); dirty = false;
  if (drawer) fecharEditor();
  renderTopo(); renderAbas(); mostrarAba(aba, true); atualizarSalvar();
  $("#b-discard").textContent = "Descartar"; $("#b-discard").classList.remove("primary");
  toast("Alterações descartadas.");
});
function exportar() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "organograma-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("#f-import").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    const d = JSON.parse(txt); if (!d || !Array.isArray(d.roots)) throw new Error("formato");
    state = normalize(d); semDados = false; alterou();
    if (drawer) fecharEditor();
    renderTopo(); renderAbas(); mostrarAba("Organograma", true);
    toast("Dados importados. Clique em Salvar para gravar.");
  }).catch(() => toast("Esse arquivo não é um backup do organograma.", "erro")).finally(() => { e.target.value = ""; });
});

/* ---------- menu ---------- */
function fecharMenu() { const m = $("#menu"); if (m && !m.hidden) { m.hidden = true; $("#b-menu").setAttribute("aria-expanded", "false"); } }
$("#b-menu").addEventListener("click", e => {
  e.stopPropagation(); const m = $("#menu"), abrir = m.hidden; m.hidden = !abrir; $("#b-menu").setAttribute("aria-expanded", String(abrir));
  if (abrir) anim(m, [{ opacity: 0, transform: "translateY(-6px) scale(.98)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: EASE });
});
document.addEventListener("click", e => { if (!e.target.closest("#menu")) fecharMenu(); });
$("#menu").addEventListener("click", async e => {
  const act = e.target.dataset && e.target.dataset.act; if (!act) return; fecharMenu();
  if (act === "instalar") instalar();
  if (act === "geral") abrirEditor("geral");
  if (act === "setores") abrirEditor("setores");
  if (act === "export") exportar();
  if (act === "import") $("#f-import").click();
  if (act === "sair") {
    if (dirty) { toast("Há alterações não salvas. Salve ou descarte antes de sair.", "erro"); return; }
    if (fb) await fb.authM.signOut(fb.auth);
    location.reload();
  }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && state) { e.preventDefault(); salvar(); }
  if (e.key === "Escape") { if (!$("#menu").hidden) fecharMenu(); else if (drawer) fecharEditor(); }
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", () => moverIndicador(false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state && aba === "Organograma") { desenharLinhas(); aplicarZoom(zoom); } moverIndicador(false); });

/* ---------- aplicativo instalável ---------- */
let pedidoInstalar = null;
const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function mostrarInstalar(v) { $$(".instalar").forEach(b => b.hidden = !v); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedidoInstalar = e; mostrarInstalar(true); });
window.addEventListener("appinstalled", () => { pedidoInstalar = null; mostrarInstalar(false); toast("Aplicativo instalado."); });
if (ehIOS && !instalado()) mostrarInstalar(true);
async function instalar() {
  if (pedidoInstalar) { pedidoInstalar.prompt(); const r = await pedidoInstalar.userChoice; if (r.outcome === "accepted") mostrarInstalar(false); pedidoInstalar = null; return; }
  if (ehIOS) toast("No iPhone: toque em Compartilhar (quadrado com seta) e depois em \"Adicionar à Tela de Início\".", "info", null, 9000);
  else toast("Use o ícone de instalar na barra de endereço do navegador, ou o menu do navegador → \"Instalar aplicativo\".", "info", null, 9000);
}
$$(".gate .instalar").forEach(b => b.addEventListener("click", instalar));

/* ---------- início ---------- */
(async function iniciar() {
  if (!CONFIGURADO) { prontoParaEntrar(); return; }
  try {
    const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
    const [appM, authM, fs] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app), db = fs.getFirestore(app);
    fb = { auth, authM, fs, db, ref: fs.doc(db, COLECAO, DOCUMENTO) };
    let primeiro = true;
    authM.onAuthStateChanged(auth, user => {
      if (user) entrar(user);
      else if (primeiro) prontoParaEntrar();
      primeiro = false;
    });
  } catch (e) {
    gateMsg("Não foi possível conectar ao Firebase. Verifique a internet e recarregue a página.");
  }
})();
</script>
